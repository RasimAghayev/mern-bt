name: CI

# The whole quality gate runs inside the project's own Docker images, so the
# runner needs a Docker daemon and nothing else. No Node.js toolchain is
# installed on the runner.
on:
  push:
    branches: [master, test]
  pull_request:
    branches: [master, test]

# The pipeline only reads the repository. It never publishes anything and never
# writes to the GitHub API.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Docker quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create the local environment file
        # The compose stack reads the environment from var/.env (R92). The
        # values are the placeholders of .env.example.
        run: |
          mkdir -p var
          cp .env.example var/.env

      - name: Build the test image
        run: docker compose build test

      - name: Run the test suite
        run: docker compose --profile test run --rm test

      - name: Run the linter
        run: docker compose --profile test run --rm lint

      - name: Audit the dependencies
        run: docker compose --profile test run --rm --entrypoint npm test audit --audit-level=high

      - name: Build the runtime image
        run: docker compose build app
